[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmt-voice-studio"
version = "1.3.35"
description = "BMT Voice Studio — Neural TTS, Audio Builder, Video Maker"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Believers Manna Today" }]
dependencies = [
  "PySide6>=6.6.0",
  "edge-tts>=6.1.9",
  "httpx>=0.27.0",
  "imageio-ffmpeg>=0.5.1",
  "mutagen>=1.47.0",
  "Pillow>=10.0.0",
  "aiofiles>=23.2.1",
  "packaging>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pyinstaller>=6.3.0"]

[project.scripts]
bmt-voice-studio = "bmt_voice_studio.app:main"

[tool.setuptools.packages.find]
include = ["bmt_voice_studio*"]

[tool.setuptools.package-data]
bmt_voice_studio = ["resources/*.png", "resources/flags/*.png", "resources/default_media/**/*.mp4", "config/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
